<body class="ws-std">

  <main class="app-main">
    <div class="page-head">
      <div>
        <h1><i class="fa-solid fa-file-circle-check me-2"></i>พิจารณาเห็นชอบเอกสาร (ผอ.กบค.)</h1>
      </div>
      <div class="ms-auto text-end">
        <span class="flow-ref">ผอ.กบค. พิจารณาคำสั่ง (6.1.4 / 6.2.1) และหนังสือขอให้ลงโทษทางวินัย (7.2.1) ก่อนเสนอผู้ลงนาม</span>
        <div class="mt-1" id="stBadge"></div>
      </div>

    <!-- โหมดรายการ (ไม่มี ?case=) -->
    <div id="listView" class="d-none">
      <div class="ws-card mb-3">
        <div class="card-header"><i class="fa-solid fa-list-check"></i> เอกสารรอ ผอ.กบค. พิจารณา</div>

      </div>
    </div>

    <!-- โหมดพิจารณาเรื่อง -->
    <div class="document-workspace d-none" id="docWorkspace">
      <div id="docLeftCol">
        <div class="ws-card mb-3">
          <div class="card-header"><i class="fa-solid fa-circle-info"></i> สรุปสำนวน</div>
          <div class="card-body"><div class="row g-2 kv" id="summary"></div></div>
        </div>
        <div class="ws-card mb-3">
          <div class="card-header"><i class="fa-solid fa-file-lines"></i> เอกสารที่เสนอ</div>
          <div class="card-body" id="docInfo"></div>
        </div>
        <div class="ws-card mb-3">
          <div class="card-header"><i class="fa-solid fa-comment-dots"></i> ความเห็น ผอ.กบค.</div>
          <div class="card-body" id="opinionBody"></div>
        </div>
      </div>

      <aside class="ws-doc-pane" style="top:calc(var(--topbar-h) + 14px)">
        <button type="button" class="ws-doc-pane-rail" id="btnPaneExpand" title="ขยายแผงเอกสาร"><i class="fa-solid fa-angles-left"></i><span>เอกสาร</span></button>
        <div class="ws-doc-toolbar">
          <div class="d-flex flex-column w-100 gap-1">
            <div class="d-flex justify-content-between align-items-center">
              <span class="name"><i class="fa-solid fa-file-lines me-1"></i> บันทึกเสนอ ผอ.กบค.</span>
              <div class="d-flex gap-1 align-items-center">
                <button type="button" class="btn-doc-edit" id="btnDocEdit" title="เปิด/ปิดโหมดแก้ไขเอกสาร">
                  <i class="fa-solid fa-pen-to-square me-1"></i><span>แก้ไขเอกสาร</span>
                </button>
                <button type="button" class="btn btn-sm btn-outline-primary" id="btnDocx" title="ส่งออกเป็นเอกสาร Microsoft Word (.docx)"><i class="fa-solid fa-file-word me-1"></i>ส่งออก DOCX</button>
                <button class="btn btn-sm btn-light border" onclick="window.print()" title="พิมพ์เอกสาร"><i class="fa-solid fa-print"></i></button>
                <button type="button" class="btn btn-sm btn-light border" id="btnDocFullscreen" title="ขยายเต็มจอ"><i class="fa-solid fa-expand"></i></button>
                <button type="button" class="ws-doc-pane-toggle" id="btnPaneCollapse" title="ย่อแผงเอกสาร"><i class="fa-solid fa-angles-right"></i></button>
              </div>
            </div>

            <!-- Symmetrical Pagination & Zoom Navigator Bar -->
            <div class="pagination-toolbar-symmetric" id="docPaginationBar">
              <div class="toolbar-group">
                <div class="btn-group btn-group-sm" role="group">
                  <button type="button" class="btn btn-xs btn-primary btn-toolbar-nav" id="btnModeSingle" title="โหมดดูทีละหน้า (เร็ว ลื่น)">
                    <i class="fa-solid fa-file me-1"></i>ดูทีละหน้า
                  </button>
                  <button type="button" class="btn btn-xs btn-outline-light btn-toolbar-nav" id="btnModeContinuous" title="โหมดดูทุกหน้าเรียงกัน">
                    <i class="fa-solid fa-file-lines me-1"></i>ดูทุกหน้าต่อเนื่อง
                  </button>
                </div>
                <div class="toolbar-divider"></div>
                <div class="btn-group btn-group-sm" role="group">
                  <button type="button" class="btn btn-xs btn-secondary btn-toolbar-nav" id="btnFirstPage" title="หน้าแรกสุด (หน้า 1)"><i class="fa-solid fa-backward-step"></i></button>
                  <button type="button" class="btn btn-xs btn-secondary btn-toolbar-nav" id="btnPrevPage" title="หน้าก่อนหน้า"><i class="fa-solid fa-chevron-left"></i></button>
                </div>
                <div class="d-flex align-items-center gap-1">
                  <span class="small opacity-75">หน้า</span>
                  <input type="number" class="page-input-num" id="pageNumberInput" min="1" value="1">
                  <span class="small opacity-75" id="totalPagesText">/ 1 หน้า</span>
                </div>
                <div class="btn-group btn-group-sm" role="group">
                  <button type="button" class="btn btn-xs btn-secondary btn-toolbar-nav" id="btnNextPage" title="หน้าถัดไป"><i class="fa-solid fa-chevron-right"></i></button>
                  <button type="button" class="btn btn-xs btn-secondary btn-toolbar-nav" id="btnLastPage" title="หน้าสุดท้าย"><i class="fa-solid fa-forward-step"></i></button>
                </div>
              </div>
              <div class="toolbar-group ms-auto">
                <div class="d-flex align-items-center bg-dark rounded px-1" style="height:26px;">
                  <button type="button" class="btn btn-link btn-xs text-light p-1 text-decoration-none" id="btnZoomOut" title="ย่อขนาด"><i class="fa-solid fa-magnifying-glass-minus"></i></button>
                  <span style="font-size:0.75rem; width:34px; text-align:center; font-weight:600;" id="zoomLevelText">75%</span>
                  <button type="button" class="btn btn-link btn-xs text-light p-1 text-decoration-none" id="btnZoomIn" title="ขยายขนาด"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
                </div>
              </div>

          </div>
        </div>
        <div class="ws-paper-stage" id="docPaperStage">
          <div id="docPaper"></div>
        </div>
      </aside>
    </div>
    </div>

    <div id="actionBarSlot"></div>
  </main>

  <script src="assets/vendor/jquery/jquery.min.js"></script>
  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="assets/vendor/sweetalert2/sweetalert2.all.min.js"></script>

  <script src="assets/vendor/docxtemplater/docxtemplater.js"></script>
  <script src="assets/vendor/supabase/supabase.js"></script>
  <script src="assets/ecmis-localdb.js"></script>
  <script src="../shared-assets/auth.js?v=20261002-boundary2"></script>
  <script src="../cases.js"></script>
  <script src="assets/ecmis-app.js?v=20261122-flow2"></script>
  <script src="assets/ecmis-livedoc.js?v=20261122-livedoc2"></script>
  <script src="../shared-assets/handoff.js"></script>
  <script src="../shared-assets/junctions.js"></script>
  <script src="assets/junction-bridge-a7.js?v=20261006-a7-g73-picks"></script>
  <script src="assets/ecmis-model.js"></script>
  <script src="assets/saraban-no.js?v=20261121-a7-saraban"></script>
  <script src="assets/a7-dircase-approval.js?v=20261122-b1"></script>
  <script>
    /* ผอ.กบค. พิจารณาเห็นชอบเอกสารก่อนเสนอผู้ลงนาม — User Flow V1.0.14 Option B หน้า 6-1 (6.1.4), 6-2 (6.2.1), 7-2 (7.2.1)
       ไม่เปลี่ยนสถานะสำนวน: บันทึกผลใน trr_resolution_data.dirCaseApproval และ event DIR_CASE_APPROVE / DIR_CASE_RETURN
       ผู้ลงนามเห็นผลเป็นแถบบนหน้า order.html / ruling-report.html (assets/a7-dircase-approval.js) */
    ECMIS.renderShell('dir-case-approve.html');

    const SUPABASE_URL = 'https://ljhabbwjxnoucrcrsoii.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2Bps-dWMZHz_7cs3BppF6A_ul1_A_xd';
    const sb = ECMIS.getSupabaseClient(SUPABASE_URL, SUPABASE_KEY);
    const DA = window.A7DirApproval;
    const E = ECMIS.escapeHtml;
    const T = ECMIS.toThaiDigits;

    const params = new URLSearchParams(location.search);
    const role = ECMIS.currentRole();
    const dirCase = ECMIS.getRole('dir_case');
    const mayDecide = role.id === 'dir_case';
    let kase = null, stage = null;

    async function loadCaseFromSupabase(caseId) {
      const { data, error } = await sb
        .from('tbl_res_request')
        .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
        .eq('tbl_cmp_case.tcc_no', caseId)
        .eq('is_deleted', false)
        .maybeSingle();
      if (error) throw error;
      return data ? ECMIS.supabaseRowToCase(data) : null;
    }

    /* ---------- โหมดรายการ ---------- */
    async function renderList() {
      document.getElementById('listView').classList.remove('d-none');
      const codes = DA.ORDER_STATUSES.concat(DA.DISCIPLINE_STATUSES).map(s => ECMIS.STATUS_CODE[s]).filter(Boolean);
      let rows = [];
      try {
        const { data, error } = await sb.from('tbl_res_request')
          .select('*, tbl_cmp_case!inner(*, tbl_cmp_case_accused(*))')
          .in('trr_status', codes).eq('is_deleted', false);
        if (error) throw error;
        rows = (data || []).map(ECMIS.supabaseRowToCase).filter(Boolean);
      } catch (e) {
        console.warn('โหลดรายการไม่สำเร็จ:', e);
      }
      const host = document.getElementById('listBody');
      if (!rows.length) {
        host.innerHTML = '<div class="text-muted"><i class="fa-solid fa-circle-info me-1"></i>ยังไม่มีเอกสารรอพิจารณา</div>';
        return;
      }
      rows.sort((a, b) => String(a.id).localeCompare(String(b.id)));
      host.innerHTML = `<div class="table-responsive"><table class="table table-sm dca-list mb-0">
        <thead><tr><th>ขั้น</th><th>เลขสำนวน</th><th>เรื่อง</th><th>เอกสาร</th><th>ผลพิจารณา</th><th></th></tr></thead>
        <tbody>${rows.map(k => {
          const sg = DA.stageOf(k);
          const rec = DA.recordOf(k, sg);
          const res = rec ? (rec.decision === 'APPROVED' ? '<span class="badge bg-success">เห็นชอบแล้ว</span>' : '<span class="badge bg-warning text-dark">ส่งกลับแก้ไข</span>') : '<span class="badge bg-secondary">รอพิจารณา</span>';
          const href = `dir-case-approve.html?case=${encodeURIComponent(k.id)}&stage=${sg}`;
          return `<tr><td><span class="dca-stage">${sg}</span></td><td>${E(ECMIS.caseNo(k))}</td><td>${E(k.subject || '—')}</td>
            <td>${E(DA.STAGES[sg].docTitle)}</td><td>${res}</td>
            <td class="text-end"><a class="btn btn-sm btn-primary" href="${href}"><i class="fa-solid fa-magnifying-glass me-1"></i>พิจารณา</a></td></tr>`;
        }).join('')}</tbody></table></div>`;
    }

    /* ---------- โหมดพิจารณาเรื่อง ---------- */
    (async function main() {
      const caseParam = params.get('case');
      if (!caseParam) { renderList(); return; }
      try { kase = await loadCaseFromSupabase(caseParam); } catch (err) { console.warn('โหลดข้อมูลจากฐานข้อมูลไม่สำเร็จ:', err); }
      if (!kase) kase = ECMIS.requireCase(caseParam);
      if (!kase) {
        document.getElementById('listView').classList.remove('d-none');
        document.getElementById('listBody').innerHTML = '<div class="no-permission"><i class="fa-solid fa-circle-info me-1"></i>ไม่พบสำนวน</div>';
        return;
      }
      stage = DA.stageOf(kase, params.get('stage'));
      document.getElementById('docWorkspace').classList.remove('d-none');
      renderPage();
    })();

    function signerRole() { return ECMIS.getRole(DA.signerRoleOf(kase, stage) || 'chairman'); }
    function isOpen() { return !!stage && DA.isOpenFor(kase, stage); }

    function docFacts() {
      const st = DA.STAGES[stage];
      const rd = kase.resolutionData || {};
      if (!st) return [];
      if (st.key === 'order') {
        const members = rd.order24Members || kase.order24Members || [];
        return [
          ['ประเภทเอกสาร', st.docTitle],
          ['เลขที่คำสั่ง', rd.orderNo || kase.orderNo || ''],
          ['ลงวันที่', (rd.orderDate || kase.orderDate) ? ECMIS.thaiDate(rd.orderDate || kase.orderDate) : ''],
          ['ผู้ไต่สวน', members.length ? members.length + ' คน' : '']
        ];
      }
      return [
        ['ประเภทเอกสาร', st.docTitle],
        ['เลขหนังสือ', ECMIS.sarabanNoOf ? ECMIS.sarabanNoOf(kase, 'disciplineLetter72') : ''],
        ['ผู้ถูกกล่าวหา', (kase.accused || []).map(a => a.name).filter(Boolean).join(', ')]
      ];
    }

    function renderPage() {
      const st = DA.STAGES[stage];
      document.title = `พิจารณาเห็นชอบ — ${ECMIS.caseNo(kase)} | E-CMIS`;
      document.getElementById('stBadge').innerHTML = `<span class="chip me-1">เลขสำนวน ${E(ECMIS.caseNo(kase))}</span>` + ECMIS.statusBadge(kase.status) + (stage ? ` <span class="chip">ขั้น ${st.step}</span>` : '');

      document.getElementById('summary').innerHTML = `
        <div class="col-md-6"><span class="k">เลขสำนวน:</span> ${E(ECMIS.caseNo(kase))}</div>
        <div class="col-md-6"><span class="k">ประเภทเรื่อง:</span> ${ECMIS.typeBadge(kase)}</div>
        <div class="col-12"><span class="k">เรื่อง:</span> ${E(kase.subject || '—')}</div>
        <div class="col-md-6"><span class="k">ผู้รับผิดชอบสำนวน:</span> ${E(kase.owner || '—')}</div>
        <div class="col-md-6"><span class="k">หน่วยงาน:</span> ${E(kase.ownerOrg || '—')}</div>`;

      if (!stage) {
        document.getElementById('docInfo').innerHTML = '<div class="text-muted">สำนวนนี้ไม่มีเอกสารรอ ผอ.กบค. พิจารณา</div>';
      } else {
        DA.injectCss();
        document.getElementById('docInfo').innerHTML = DA.bannerHtml(kase, stage)
          + `<div class="row g-2 kv dca-doc-kv">${docFacts().map(([k, v]) => `<div class="col-12"><span class="k">${E(k)}:</span> ${E(v || '—')}</div>`).join('')}</div>
          <a class="btn btn-sm btn-outline-primary mt-2" href="${st.docPage}?case=${encodeURIComponent(kase.id)}"><i class="fa-solid fa-up-right-from-square me-1"></i>เปิดเอกสารฉบับเต็ม</a>
          ${!isOpen() ? `<div class="text-muted mt-2" style="font-size:.82rem"><i class="fa-solid fa-circle-info me-1"></i>เรื่องนี้ผ่านขั้นลงนามไปแล้ว หรือยังไม่ถึงขั้น ${st.step} — แสดงเพื่ออ่านอย่างเดียว</div>` : ''}`;
      }

      const rec = stage ? DA.recordOf(kase, stage) : null;
      const canEdit = mayDecide && isOpen();
      document.getElementById('opinionBody').innerHTML = canEdit
        ? `<label class="form-label" for="dcaNote">ความเห็น / ข้อสั่งการ</label>
           <textarea id="dcaNote" class="form-control" rows="4" placeholder="เช่น เห็นชอบตามเสนอ / ให้แก้ไของค์ประกอบผู้ไต่สวน">${E((rec && rec.note) || '')}</textarea>
           <div class="text-muted mt-1" style="font-size:.78rem">ส่งกลับแก้ไขต้องระบุเหตุผล</div>`
        : `<div>${rec && rec.note ? E(rec.note) : '<span class="text-muted">—</span>'}</div>`;
      const noteEl = document.getElementById('dcaNote');
      if (noteEl) noteEl.addEventListener('input', renderDoc);

      renderDoc();
      ECMIS.initDocEditor({ stageId: 'docPaper', mayEdit: canEdit });

      const signer = signerRole();
      const buttons = canEdit ? [
        { act: 'return', label: 'ส่งกลับแก้ไข', icon: 'fa-arrow-left-long', cls: 'btn-outline-danger' },
        { act: 'approve', label: `เห็นชอบ เสนอ${signer.title}ลงนาม`, icon: 'fa-circle-check', cls: 'btn-gold' }
      ] : [];
      document.getElementById('actionBarSlot').innerHTML = ECMIS.actionBar(kase, role.id, buttons, { forceAllowed: canEdit });
      document.querySelectorAll('.action-bar [data-act]').forEach(b => b.addEventListener('click', () => handle(b.dataset.act)));
    }

    function renderDoc() {
      const docPaperEl = document.getElementById('docPaper');
      if (!docPaperEl || !stage) return;
      const M = ECMIS.mergeField;
      const st = DA.STAGES[stage];
      const signer = signerRole();
      const rec = DA.recordOf(kase, stage);
      const noteNow = (document.getElementById('dcaNote') || {}).value;
      const note = noteNow !== undefined ? noteNow : (rec && rec.note) || '';
      const facts = docFacts();
      const decided = rec && rec.decision === 'APPROVED';
      docPaperEl.innerHTML = `
    <div class="doc-paper doc-resolution a4-paper active-page" id="docPaperPage">
      <div class="doc-secret">ลับ</div>
      <div class="doc-title">
        <div class="doc-title-l1">บันทึกข้อความ</div>
        <div class="doc-title-l2">บันทึกเสนอ${M(st.docTitle)}</div>
      </div>
      <div class="doc-row"><span class="k">ส่วนราชการ</span> สำนักงาน ป.ป.ท. กองบริหารคดี (กลุ่มงานกิจการคณะกรรมการ ป.ป.ท.)</div>
      <div class="doc-row"><span class="k">เรื่อง</span> เสนอ${M(st.docTitle)} สำนวนเรื่องที่ ${M(T(ECMIS.caseNo(kase)))}</div>
      <div class="doc-row"><span class="k">เรียน</span> ผู้อำนวยการกองบริหารคดี</div>
      <div class="doc-body-indent">
        <div class="doc-indent">ตามที่คณะกรรมการ ป.ป.ท. มีมติในเรื่อง ${M(kase.subject)} กลุ่มงานกิจการคณะกรรมการ ป.ป.ท. ได้จัดทำ${M(st.docTitle)} รายละเอียดดังนี้</div>
        <div class="doc-indent">${facts.slice(1).map(([k, v]) => `${E(k)} ${M(v ? T(String(v)) : '')}`).join('<br>')}</div>
        <div class="doc-indent">จึงเรียนมาเพื่อโปรดพิจารณา หากเห็นชอบ โปรดเสนอ${M(signer.title)}ลงนามต่อไป</div>
      </div>
      <div class="doc-sign">(กลุ่มงานกิจการคณะกรรมการ ป.ป.ท.)</div>

      <div class="doc-h mt-3">ความเห็น ผู้อำนวยการกองบริหารคดี (ขั้น ${st.step})</div>
      <div class="doc-body-indent"><div class="doc-indent">${M(note, '……………………………………………………………………………………', 'dcaNote')}</div></div>
      <div class="doc-sign">(${M(decided ? dirCase.name : '')})<br>${M(dirCase.title)}${decided && rec.at ? '<br>' + ECMIS.thaiDate(String(rec.at).slice(0, 10)) : ''}</div>
      <div class="doc-secret-foot">ลับ</div>
    </div>`;
      updatePaginationUI();
      applyZoom();
    }

    async function handle(act) {
      const st = DA.STAGES[stage];
      const note = (document.getElementById('dcaNote')?.value || '').trim();
      const signer = signerRole();
      if (act === 'return' && !note) {
        ECMIS.toastWarn('กรุณาระบุเหตุผลที่ส่งกลับแก้ไขในช่องความเห็น');
        document.getElementById('dcaNote')?.focus();
        return;
      }
      const approve = act === 'approve';
      const ok = await ECMIS.confirmAction({
        title: approve ? `เห็นชอบ เสนอ${signer.title}ลงนาม` : 'ส่งกลับให้กลุ่มงานกิจการฯ แก้ไข',
        html: `<p>${E(st.docTitle)} สำนวน <strong>${E(ECMIS.caseNo(kase))}</strong></p>`
          + (note ? `<p class="text-muted mb-0">ความเห็น: ${E(note)}</p>` : ''),
        confirmText: approve ? 'ยืนยันเห็นชอบ' : 'ยืนยันส่งกลับ',
        danger: !approve
      });
      if (!ok.isConfirmed) return;
      const entry = { decision: approve ? 'APPROVED' : 'RETURNED', stage, step: st.step, note, at: new Date().toISOString(), by: 'dir_case', signer: signer.id };
      const rd = kase.resolutionData || {};
      const merged = Object.assign({}, rd, { dirCaseApproval: Object.assign({}, rd.dirCaseApproval || {}, { [st.key]: entry }) });
      try {
        if (kase.trr_id && sb) {
          const { error } = await sb.from('tbl_res_request').update({ trr_resolution_data: merged }).eq('trr_id', kase.trr_id);
          if (error) throw error;
          await ECMIS.logRequestEvent(kase.trr_id, kase.status, kase.status, {
            type: approve ? 'DIR_CASE_APPROVE' : 'DIR_CASE_RETURN', actorRole: 'dir_case', note: note || null,
            data: { stage, step: st.step, docTitle: st.docTitle, signer: signer.id }
          });
        }
      } catch (e) {
        console.error(e);
        ECMIS.toastWarn('บันทึกลงฐานข้อมูลไม่สำเร็จ: ' + e.message);
        return;
      }
      kase.resolutionData = merged;
      ECMIS.pushCaseHistory(kase, { action: approve ? 'DIR_CASE_APPROVE' : 'DIR_CASE_RETURN', status: kase.status, stage, note });
      ECMIS.toastOk(approve ? `เห็นชอบแล้ว · เสนอ${signer.title}ลงนาม` : 'ส่งกลับให้กลุ่มงานกิจการฯ แก้ไขแล้ว', ECMIS.caseNo(kase));
      renderPage();
    }

    /* ---------- Document workspace: collapsible pane ---------- */
    const docWorkspace = document.getElementById('docWorkspace');
    const PANE_KEY = 'ecmis-dir-case-approve-docpane-collapsed';
    function setPaneCollapsed(collapsed) {
      if (docWorkspace) docWorkspace.classList.toggle('pane-collapsed', collapsed);
      try { localStorage.setItem(PANE_KEY, collapsed ? '1' : '0'); } catch (e) { }
    }
    try { if (localStorage.getItem(PANE_KEY) === '1') setPaneCollapsed(true); } catch (e) { }
    document.getElementById('btnPaneCollapse').addEventListener('click', () => setPaneCollapsed(true));
    document.getElementById('btnPaneExpand').addEventListener('click', () => setPaneCollapsed(false));

    ECMIS.initDocFullscreen({
      paneEl: document.querySelector('.ws-doc-pane'),
      btnEl: document.getElementById('btnDocFullscreen'),
      onToggle: () => applyZoom()
    });

    ECMIS.initCardCollapse('#docLeftCol', 'ecmis-dir-case-approve');

    /* ---------- Master Toolbar & Pagination Controls ---------- */
    let docViewMode = 'SINGLE';
    let docCurrentPage = 1;
    let docTotalPages = 1;
    let docZoomLevel = 0.75;

    function updatePaginationUI() {
      const docPaperEl = document.getElementById('docPaper');
      if (!docPaperEl) return;
      const pages = docPaperEl.querySelectorAll('.doc-paper, .a4-paper');
      docTotalPages = Math.max(1, pages.length);
      if (docCurrentPage > docTotalPages) docCurrentPage = docTotalPages;
      if (docCurrentPage < 1) docCurrentPage = 1;
      $('#totalPagesText').text(`/ ${docTotalPages} หน้า`);
      $('#pageNumberInput').attr('max', docTotalPages).val(docCurrentPage);
      if (docViewMode === 'SINGLE') {
        docPaperEl.classList.remove('mode-continuous');
        docPaperEl.classList.add('mode-single');
        pages.forEach((p, idx) => {
          const on = idx + 1 === docCurrentPage;
          p.classList.toggle('active-page', on);
          p.style.display = on ? 'block' : 'none';
        });
        $('#btnModeSingle').removeClass('btn-outline-light').addClass('btn-primary');
        $('#btnModeContinuous').removeClass('btn-primary').addClass('btn-outline-light');
        $('#btnFirstPage, #btnPrevPage').prop('disabled', docCurrentPage === 1);
        $('#btnNextPage, #btnLastPage').prop('disabled', docCurrentPage === docTotalPages);
        $('#pageNumberInput').prop('disabled', false);
      } else {
        docPaperEl.classList.remove('mode-single');
        docPaperEl.classList.add('mode-continuous');
        pages.forEach(p => { p.classList.add('active-page'); p.style.display = 'block'; });
        $('#btnModeContinuous').removeClass('btn-outline-light').addClass('btn-primary');
        $('#btnModeSingle').removeClass('btn-primary').addClass('btn-outline-light');
        $('#btnFirstPage, #btnPrevPage, #btnNextPage, #btnLastPage, #pageNumberInput').prop('disabled', true);
      }
      applyZoom();
    }

    function applyZoom() {
      const docPaperEl = document.getElementById('docPaper');
      if (!docPaperEl) return;
      docPaperEl.style.transform = `scale(${docZoomLevel})`;
      docPaperEl.style.transformOrigin = 'top center';
      $('#zoomLevelText').text(`${Math.round(docZoomLevel * 100)}%`);
      const pages = docPaperEl.querySelectorAll('.doc-paper, .a4-paper');
      if (!pages.length) return;
      if (docViewMode === 'SINGLE') {
        const activeP = docPaperEl.querySelector('.doc-paper.active-page, .a4-paper.active-page') || pages[0];
        docPaperEl.style.height = `${Math.round((activeP.offsetHeight || 1123) * docZoomLevel)}px`;
      } else {
        let totalH = 0;
        pages.forEach(p => { totalH += (p.offsetHeight || 1123) + 18; });
        docPaperEl.style.height = `${Math.round(totalH * docZoomLevel)}px`;
      }
    }

    $('#btnModeSingle').on('click', () => { docViewMode = 'SINGLE'; updatePaginationUI(); });
    $('#btnModeContinuous').on('click', () => { docViewMode = 'CONTINUOUS'; updatePaginationUI(); });
    $('#btnFirstPage').on('click', () => { docCurrentPage = 1; updatePaginationUI(); });
    $('#btnPrevPage').on('click', () => { if (docCurrentPage > 1) { docCurrentPage--; updatePaginationUI(); } });
    $('#btnNextPage').on('click', () => { if (docCurrentPage < docTotalPages) { docCurrentPage++; updatePaginationUI(); } });
    $('#btnLastPage').on('click', () => { docCurrentPage = docTotalPages; updatePaginationUI(); });
    $('#pageNumberInput').on('change', function () {
      let val = parseInt($(this).val(), 10);
      if (isNaN(val) || val < 1) val = 1;
      if (val > docTotalPages) val = docTotalPages;
      docCurrentPage = val;
      updatePaginationUI();
    });
    $('#btnZoomIn').on('click', () => { if (docZoomLevel < 1.5) { docZoomLevel = Math.min(1.5, Math.round((docZoomLevel + 0.1) * 10) / 10); applyZoom(); } });
    $('#btnZoomOut').on('click', () => { if (docZoomLevel > 0.4) { docZoomLevel = Math.max(0.4, Math.round((docZoomLevel - 0.1) * 10) / 10); applyZoom(); } });

    $('#btnDocx').on('click', function () {
      const caseIdClean = (kase && kase.id ? kase.id : 'case').replace(/[\/\s]/g, '-');
      ECMIS.exportDocToDocx('docPaper', `บันทึกเสนอ ผอ.กบค._${caseIdClean}.docx`);
    });
  </script>
<script src="../shared-assets/case-bar.js"></script>
<script src="../shared-assets/pipe-buttons.js"></script>
<script src="../shared-assets/case-inbox.js"></script>
</body>

</html>
